<!DOCTYPE html>
<html>
<head>
    <title>Test Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] { 
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; 
        }
        input[type="file"] { padding: 8px; }
        button { 
            background: #007bff; color: white; padding: 10px 20px; 
            border: none; border-radius: 4px; cursor: pointer; 
        }
        button:hover { background: #0056b3; }
        .result { 
            margin-top: 20px; padding: 15px; background: #f4f4f4; 
            border-radius: 4px; white-space: pre-wrap; 
        }
        img { max-width: 200px; margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; }
        hr { margin: 30px 0; }
    </style>
</head>
<body>
    <h1>📸 Test Image Upload</h1>
    
    <h2>Register</h2>
    <form id="registerForm" enctype="multipart/form-data">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" value="Sakshi Kolte" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" value="sakshikolte308@gmail.com" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" value="test123" required>
        </div>
        <div class="form-group">
            <label>Profile Image:</label>
            <input type="file" name="profileImage" accept="image/*" required>
        </div>
        <button type="submit">Register</button>
    </form>
    
    <div id="registerResult" class="result"></div>

    <hr>

    <h2>Login</h2>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="loginEmail" value="sakshikolte308@gmail.com">
    </div>
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="loginPassword" value="test123">
    </div>
    <button onclick="login()">Login</button>
    
    <div id="loginResult" class="result"></div>

    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            document.getElementById('registerResult').innerHTML = '⏳ Uploading...';
            
            try {
                const response = await fetch('http://localhost:9090/user/auth/register', {
                    method: 'POST',
                    body: formData
                });
                const text = await response.text();
                document.getElementById('registerResult').innerHTML = `✅ ${text}`;
            } catch (error) {
                document.getElementById('registerResult').innerHTML = `❌ Error: ${error.message}`;
            }
        };

        async function login() {
            document.getElementById('loginResult').innerHTML = '⏳ Logging in...';
            
            try {
                const response = await fetch('http://localhost:9090/user/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await response.json();
                
                let html = JSON.stringify(data, null, 2);
                if (data.profileImageUrl) {
                    html += `\n\n🖼️ Image URL: ${data.profileImageUrl}`;
                    html += `\n\n<img src="http://localhost:9090${data.profileImageUrl}" alt="Profile Image">`;
                }
                document.getElementById('loginResult').innerHTML = html;
            } catch (error) {
                document.getElementById('loginResult').innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
